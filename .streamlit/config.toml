[theme]
primaryColor = "#1e88e5"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f5"
textColor = "#333333"
font = "sans serif"

[client]
showErrorDetails = true

[global]
# Loaded settings are written into session state for widgets that also pass a
# default value; that's intended, so don't warn about it.
disableWidgetStateDuplicationWarning = true
